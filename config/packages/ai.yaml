ai:
    # see https://symfony.com/doc/current/ai/components/platform.html
    platform:
        ollama:
            endpoint: '%env(OLLAMA_ENDPOINT)%'
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'

    # see https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:
        # Phase 0 Proof 2 (spike): one chat completion with one tool call.
        spike:
            platform: ai.platform.ollama
            model: '%env(LEASH_SPIKE_MODEL)%'
            prompt: 'You answer questions about refund cases. Always look facts up with the tools; never guess.'
            tools:
                services:
                    - service: App\Spike\CaseAmountTool

    # see https://symfony.com/doc/current/ai/components/store.html
    store:

security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        # The approver password is a random value from .env.local (`make install`), compared as is (decisions/024).
        Symfony\Component\Security\Core\User\InMemoryUser: { algorithm: plaintext }
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Human approver for the inbox (PLAN §3.3).
        approvers:
            memory:
                users:
                    approver: { password: '%env(APPROVER_PASSWORD)%', roles: [ROLE_APPROVER] }
        agents:
            memory:
                users:
                    'agent:author': { roles: [ROLE_AUTHOR] }
                    'agent:reviewer': { roles: [ROLE_REVIEWER] }
                    # Werewolf: game roles come from WerewolfSeatRoleResolver, not from here.
                    'seat:1': { roles: [ROLE_SEAT] }
                    'seat:2': { roles: [ROLE_SEAT] }
                    'seat:3': { roles: [ROLE_SEAT] }
                    'seat:4': { roles: [ROLE_SEAT] }
                    'seat:5': { roles: [ROLE_SEAT] }
                    'seat:6': { roles: [ROLE_SEAT] }
                    'werewolf:moderator': { roles: [ROLE_MODERATOR] }

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # MCP endpoints: bearer token per agent, no session (PLAN §3.2).
        mcp:
            pattern: ^/mcp/
            stateless: true
            provider: agents
            entry_point: App\Security\BearerEntryPoint
            access_token:
                token_handler: App\Security\StaticTokenHandler
        main:
            lazy: true
            provider: approvers
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: inbox
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/mcp/, roles: IS_AUTHENTICATED }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # Signed item links open without login; the controller checks the signature (decisions/024).
        - { path: ^/inbox/item/, roles: PUBLIC_ACCESS }
        - { path: ^/inbox, roles: ROLE_APPROVER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

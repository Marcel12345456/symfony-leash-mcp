framework:
    messenger:
        transports:
            # Doctrine queue: `make demo` runs the worker.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            sync: 'sync://'

        routing:
            Leash\HumanInput\Pending\ResumePendingInput: async
            App\Agent\Message\RunNextActor: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'

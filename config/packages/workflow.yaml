# MCP metadata contract: PLAN §3.2, decisions/012. Tool names are {mcp_prefix}_{transition}.
# M1 scope: `issue` takes no input and has no approval policy yet (both arrive in M2).
framework:
    workflows:
        refund_case:
            type: state_machine
            metadata:
                mcp_prefix: refund
                mcp_subject: App\RefundDesk\Entity\RefundCase
            marking_store: { type: method, property: status }
            supports: [App\RefundDesk\Entity\RefundCase]
            initial_marking: received
            places:
                received: ~
                investigating:
                    metadata:
                        mcp_tools:
                            refund_get_order: [ROLE_INVESTIGATOR]
                            refund_get_customer_history: [ROLE_INVESTIGATOR]
                            refund_search_policy: [ROLE_INVESTIGATOR, ROLE_RESOLVER]
                proposed:
                    metadata:
                        mcp_tools:
                            refund_get_proposal: [ROLE_RESOLVER]
                            refund_search_policy: [ROLE_RESOLVER]
                refunded: ~
                rejected: ~
                closed: ~
            transitions:
                start_investigation:
                    from: received
                    to: investigating
                    metadata:
                        mcp_roles: [ROLE_INVESTIGATOR]
                        mcp_description: 'Begin investigating this refund case.'
                propose_resolution:
                    from: investigating
                    to: proposed
                    metadata:
                        mcp_roles: [ROLE_INVESTIGATOR]
                        mcp_description: 'Record your proposed resolution (refund or reject) with amount and rationale.'
                        mcp_input: App\RefundDesk\Mcp\Input\ProposeResolutionInput
                issue:
                    from: proposed
                    to: refunded
                    guard: "is_granted('REFUND_ISSUE', subject) and subject.isRefundDecision()"
                    metadata:
                        mcp_roles: [ROLE_RESOLVER]
                        mcp_description: 'Issue the proposed refund.'
                reject:
                    from: proposed
                    to: rejected
                    guard: "subject.isRejectDecision()"
                    metadata:
                        mcp_roles: [ROLE_RESOLVER]
                        mcp_description: 'Reject the refund request with a reason for the customer.'
                        mcp_input: App\RefundDesk\Mcp\Input\RejectInput
                revise:
                    from: proposed
                    to: investigating
                    metadata:
                        mcp_roles: [ROLE_RESOLVER]
                        mcp_description: 'Send the case back to investigation, e.g. after a human declined the refund.'
                close:
                    from: [refunded, rejected]
                    to: closed
                    metadata:
                        mcp_roles: [ROLE_RESOLVER]
                        mcp_description: 'Close a refunded or rejected case.'

        # Werewolf (PLAN §3.5): transitions are the moderator's; seats act through place tools while it is their turn.
        # Roles come from WerewolfSeatRoleResolver: ROLE_ALIVE/ROLE_DEAD, ROLE_WOLF/SEER/VILLAGER, *_ON_TURN.
        werewolf_game:
            type: state_machine
            metadata:
                mcp_prefix: ww
                mcp_subject: App\Werewolf\Entity\WerewolfGame
                mcp_role_resolver: App\Werewolf\Workflow\WerewolfSeatRoleResolver
            marking_store: { type: method, property: status }
            supports: [App\Werewolf\Entity\WerewolfGame]
            initial_marking: night
            places:
                night:
                    metadata:
                        mcp_tools:
                            ww_choose_victim: [ROLE_WOLF_ON_TURN]
                            ww_inspect: [ROLE_SEER_ON_TURN]
                        mcp_resources: &werewolf_resources
                            public-log: [ROLE_ALIVE, ROLE_DEAD, ROLE_MODERATOR]
                            me: [ROLE_ALIVE]
                            wolf-den: [ROLE_WOLF]
                            seer-notes: [ROLE_SEER]
                dawn:
                    metadata:
                        mcp_resources: *werewolf_resources
                day_discussion:
                    metadata:
                        mcp_tools:
                            ww_say: [ROLE_ON_TURN]
                        mcp_resources: *werewolf_resources
                day_vote:
                    metadata:
                        mcp_tools:
                            ww_vote: [ROLE_ON_TURN]
                        mcp_resources: *werewolf_resources
                over:
                    metadata:
                        mcp_resources: *werewolf_resources
            transitions:
                break_dawn:
                    from: night
                    to: dawn
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Resolve the night: the wolves kill, dawn reveals the death.'
                open_discussion:
                    from: dawn
                    to: day_discussion
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Open the day discussion.'
                open_vote:
                    from: day_discussion
                    to: day_vote
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Close the discussion and open the vote.'
                fall_night:
                    from: day_vote
                    to: night
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Count the votes and let night fall.'
                end_game:
                    from: [night, day_vote]
                    to: over
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Resolve the phase; a side has won (or the day cap is reached).'

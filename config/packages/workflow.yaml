# MCP metadata contract: PLAN §3.2, decisions/012. Tool names are {mcp_prefix}_{transition}.
framework:
    workflows:
        # Werewolf (PLAN §3.5): transitions are the moderator's; seats act through place tools while it is their turn.
        # Roles come from WerewolfSeatRoleResolver: ROLE_ALIVE/ROLE_DEAD, ROLE_WOLF/SEER/VILLAGER, *_ON_TURN.
        doc_review:
            type: state_machine
            metadata:
                mcp_prefix: doc
                mcp_subject: App\DocReview\Entity\Document
            marking_store: { type: method, property: status }
            supports: [App\DocReview\Entity\Document]
            initial_marking: drafting
            places:
                drafting:
                    metadata:
                        mcp_resources:
                            brief: [ROLE_AUTHOR, ROLE_REVIEWER]
                            draft: [ROLE_AUTHOR, ROLE_REVIEWER]
                            feedback: [ROLE_AUTHOR]
                in_review:
                    metadata:
                        mcp_resources:
                            brief: [ROLE_REVIEWER]
                            draft: [ROLE_AUTHOR, ROLE_REVIEWER]
                            rubric: [ROLE_REVIEWER]
                approved:
                    metadata:
                        mcp_resources:
                            brief: [ROLE_REVIEWER]
                            draft: [ROLE_AUTHOR, ROLE_REVIEWER]
                published:
                    metadata:
                        mcp_resources:
                            draft: [ROLE_AUTHOR, ROLE_REVIEWER]
            transitions:
                submit_draft:
                    from: drafting
                    to: in_review
                    metadata:
                        mcp_roles: [ROLE_AUTHOR]
                        mcp_description: 'Submit your draft (title and body) for review. Read the brief and any feedback first.'
                        mcp_input: App\DocReview\Mcp\Input\SubmitDraftInput
                request_changes:
                    from: in_review
                    to: drafting
                    metadata:
                        mcp_roles: [ROLE_REVIEWER]
                        mcp_description: 'Send the draft back to the author with concrete feedback, when it fails the rubric.'
                        mcp_input: App\DocReview\Mcp\Input\FeedbackInput
                approve:
                    from: in_review
                    to: approved
                    metadata:
                        mcp_roles: [ROLE_REVIEWER]
                        mcp_description: 'Approve the draft when it meets every rubric point.'
                publish:
                    from: approved
                    to: published
                    metadata:
                        mcp_roles: [ROLE_REVIEWER]
                        mcp_description: 'Publish an approved document under a headline. A human editor signs off first.'
                        mcp_input: App\DocReview\Mcp\Input\PublishInput
                        mcp_approval: editor_signoff
                send_back:
                    from: approved
                    to: drafting
                    guard: "subject.hasEditorNote()"
                    metadata:
                        mcp_roles: [ROLE_REVIEWER]
                        mcp_description: "The editor declined publication: send the document back to the author with the editor's note."

        werewolf_game:
            type: state_machine
            metadata:
                mcp_prefix: ww
                mcp_subject: App\Werewolf\Entity\WerewolfGame
                mcp_role_resolver: App\Werewolf\Workflow\WerewolfSeatRoleResolver
            marking_store: { type: method, property: status }
            supports: [App\Werewolf\Entity\WerewolfGame]
            initial_marking: night
            places:
                night:
                    metadata:
                        mcp_tools:
                            ww_choose_victim: [ROLE_WOLF_ON_TURN]
                            ww_inspect: [ROLE_SEER_ON_TURN]
                        mcp_resources: &werewolf_resources
                            public-log: [ROLE_ALIVE, ROLE_DEAD, ROLE_MODERATOR]
                            me: [ROLE_ALIVE]
                            wolf-den: [ROLE_WOLF]
                            seer-notes: [ROLE_SEER]
                dawn:
                    metadata:
                        mcp_resources: *werewolf_resources
                day_discussion:
                    metadata:
                        mcp_tools:
                            ww_say: [ROLE_ON_TURN]
                        mcp_resources: *werewolf_resources
                day_vote:
                    metadata:
                        mcp_tools:
                            ww_vote: [ROLE_ON_TURN]
                        mcp_resources: *werewolf_resources
                over:
                    metadata:
                        mcp_resources: *werewolf_resources
            transitions:
                break_dawn:
                    from: night
                    to: dawn
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Resolve the night: the wolves kill, dawn reveals the death.'
                open_discussion:
                    from: dawn
                    to: day_discussion
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Open the day discussion.'
                open_vote:
                    from: day_discussion
                    to: day_vote
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Close the discussion and open the vote.'
                fall_night:
                    from: day_vote
                    to: night
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Count the votes and let night fall.'
                end_game:
                    from: [night, day_vote]
                    to: over
                    metadata:
                        mcp_roles: [ROLE_MODERATOR]
                        mcp_description: 'Resolve the phase; a side has won (or the day cap is reached).'

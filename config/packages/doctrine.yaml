doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
            DocReview:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/DocReview/Entity'
                prefix: 'App\DocReview\Entity'
            Werewolf:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Werewolf/Entity'
                prefix: 'App\Werewolf\Entity'
            LeashHumanInput:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/lib/HumanInput/Doctrine'
                prefix: 'Leash\HumanInput\Doctrine'
            LeashHumanInputPending:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/lib/HumanInput/Pending'
                prefix: 'Leash\HumanInput\Pending'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

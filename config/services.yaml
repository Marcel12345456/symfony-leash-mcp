# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Werewolf transcripts (decisions/032); tests write into the cache dir.
    leash.werewolf.transcripts: '%kernel.project_dir%/var/werewolf'
    # Recorded Werewolf games, committed (decisions/033); tests replay the same files.
    leash.werewolf.cassettes: '%kernel.project_dir%/data/werewolf'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Agents reach the MCP endpoints through this app's kernel, no web server needed.
    App\Agent\McpConnector:
        arguments:
            $http: '@App\Agent\InProcessPsr18Client'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Leash libraries (lib/): services autowired; value objects, events and attributes excluded.
    Leash\WorkflowMcp\:
        resource: '../lib/WorkflowMcp/'
        exclude:
            - '../lib/WorkflowMcp/Capability/VisibleResource.php'
            - '../lib/WorkflowMcp/Capability/VisibleTool.php'
            - '../lib/WorkflowMcp/Event/'
            - '../lib/WorkflowMcp/Metadata/'
            - '../lib/WorkflowMcp/PlaceResource/AsPlaceResource.php'
            - '../lib/WorkflowMcp/PlaceTool/AsPlaceTool.php'
            - '../lib/WorkflowMcp/Server/UnavailableCapabilityResponder.php'
            - '../lib/WorkflowMcp/Server/UnavailableResourceResponder.php'
            - '../lib/WorkflowMcp/Tool/InvalidInputException.php'
            - '../lib/WorkflowMcp/Tool/ToolResults.php'

    Leash\WorkflowMcp\Subject\SubjectProviderInterface: '@Leash\WorkflowMcp\Subject\DoctrineSubjectProvider'

    Leash\HumanInput\:
        resource: '../lib/HumanInput/'
        exclude:
            - '../lib/HumanInput/Client/InputOutcome.php'
            - '../lib/HumanInput/Client/InputRequired.php'
            - '../lib/HumanInput/Client/McpCallFailed.php'
            - '../lib/HumanInput/Client/ToolCall.php'
            - '../lib/HumanInput/Doctrine/ProcessedInputRequest.php'
            - '../lib/HumanInput/Event/'
            - '../lib/HumanInput/Idempotency/ProcessedResult.php'
            - '../lib/HumanInput/Pending/PendingInput.php'
            - '../lib/HumanInput/Pending/PendingInputStatus.php'
            - '../lib/HumanInput/Pending/ResumePendingInput.php'
            - '../lib/HumanInput/RequestState/BoundRequest.php'
            - '../lib/HumanInput/RequestState/RejectionReason.php'
            - '../lib/HumanInput/RequestState/RequestStateRejected.php'
            - '../lib/HumanInput/Server/Decision.php'
            - '../lib/HumanInput/Server/Verdict.php'

    Leash\HumanInput\Idempotency\ProcessedInputRequests: '@Leash\HumanInput\Doctrine\DoctrineProcessedInputRequests'
    Leash\HumanInput\Pending\PendingInputs: '@Leash\HumanInput\Doctrine\DoctrinePendingInputs'
    Leash\HumanInput\Pending\HumanInputNotifier: '@App\Inbox\EmailHumanInputNotifier'
    Leash\HumanInput\Client\InputRequestHandlerInterface: '@Leash\HumanInput\Pending\DeferringInputRequestHandler'
    Leash\HumanInput\Client\CallerTokens: '@App\Security\StaticTokenHandler'

    # Calls that may need a human (agents and the resume after an answer) take the same in-process path.
    Leash\HumanInput\Client\RawMcpClient:
        arguments:
            $http: '@App\Agent\InProcessPsr18Client'

when@test:
    parameters:
        leash.werewolf.transcripts: '%kernel.cache_dir%/werewolf'
